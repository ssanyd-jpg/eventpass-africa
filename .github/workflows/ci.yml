name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Disposable, this-run-only Postgres — never the real Neon database.
    # vitest.global-setup.ts drops/recreates the whole schema on every run,
    # so it doesn't care which Postgres it's pointed at.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chaap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same URL for both — a plain local container has no separate
      # pooled/direct distinction the way Neon does.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chaap_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/chaap_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chaap_ci
      # Dummy, CI-only values — every other integration (Airpay, email, SMS,
      # Vercel Blob, etc.) is optional and falls back safely when unset; see
      # .env.example.
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Gives `next build`'s static pages (e.g. sitemap.ts, which queries
      # the Event table) a real schema to query against — an empty result
      # set is fine, a missing table isn't.
      - run: npx prisma db push --skip-generate --accept-data-loss

      - run: npm run build

      - run: npm run test:ci

  e2e:
    runs-on: ubuntu-latest
    needs: test

    # Serializes every e2e run across ALL workflow runs (different PRs
    # included) — they all share the one persistent "e2e-test" Neon branch
    # (see e2e/README.md), and resetLoginRateLimit's bucket is keyed only by
    # email (src/lib/rate-limit.ts), not scoped per run. A single clean run
    # already sits right at the 5-attempts/10-min login budget for
    # organizer@chaap.dev, so two runs hitting it at once could trip a
    # false "too many attempts" error instead of the assertion each test
    # expects. cancel-in-progress stays false: killing an in-flight run
    # mid-test would skip global-teardown.ts and leave fixture rows behind
    # on the shared branch.
    concurrency:
      group: e2e-test-neon-branch
      cancel-in-progress: false

    env:
      # Pooled/direct connection strings for the dedicated "e2e-test" Neon
      # branch (see e2e/README.md's "Database setup" section) — never the
      # production DATABASE_URL, and never the vitest job's disposable
      # container above.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium --with-deps

      # Guards against schema drift on this persistently-seeded branch —
      # cheap, and the same command e2e/README.md's one-time setup uses
      # (`prisma migrate deploy` hits P3005 here: this project applies
      # schema via db push/manual diffs, not tracked migration history).
      - run: npx prisma db push --accept-data-loss

      # Idempotent (every row in prisma/seed.ts is upserted or guarded by a
      # prior findUnique) — restores organizer@chaap.dev/fan@chaap.dev and
      # the rest of the seeded data if this branch was ever reset.
      - run: npx prisma db seed

      - run: npm run test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
